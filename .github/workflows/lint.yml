name: Lint & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy hatchling pydantic httpx typer rich pytest

      - name: Check code formatting & linting with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run strict type checking with Mypy
        run: |
          mypy src tests
